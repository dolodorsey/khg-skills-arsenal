name: Enterprise Visual Audit

on:
  push:
    paths:
      - 'enterprise-audit/sites.json'
      - 'enterprise-audit/capture.js'
      - '.github/workflows/enterprise-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture desktop and mobile evidence
        run: node enterprise-audit/capture.js
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-visual-audit
          path: artifacts/enterprise-visual-audit
          if-no-files-found: error
          retention-days: 30
